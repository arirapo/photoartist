<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traces Admin</title>
  <style>
    :root {
      --bg: #111;
      --panel: #1a1a1a;
      --panel-2: #151515;
      --text: #f2f2f2;
      --muted: #a7a7a7;
      --line: #333;
      --ok: #9fd7a7;
      --warn: #ffd38a;
      --err: #ff9f9f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.45;
    }

    .wrap {
      width: min(1180px, 94vw);
      margin: 32px auto 56px;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
    }

    .muted { color: var(--muted); }

    .login-panel,
    .filters,
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .login-panel,
    .filters {
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.9rem;
    }

    @media (max-width: 900px) {
      .row-3 { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #101010;
      color: var(--text);
      padding: 0.8rem 0.9rem;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.9rem;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #202020;
      color: var(--text);
      padding: 0.8rem 1rem;
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 0.7rem;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }

    .cards {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .card { overflow: hidden; }

    .card-inner {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
    }

    @media (max-width: 900px) {
      .card-inner { grid-template-columns: 1fr; }
    }

    .thumb {
      background: var(--panel-2);
      min-height: 220px;
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line);
    }

    @media (max-width: 900px) {
      .thumb {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    .thumb img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 360px;
      object-fit: cover;
    }

    .editor { padding: 1rem; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .small {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1rem;
      align-items: center;
    }

    .checkrow {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.8rem;
      color: var(--muted);
    }

    .checkrow label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
    }

    .empty {
      padding: 1rem 1.1rem;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
    }

    a {
      color: var(--text);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Traces Admin</h1>
    <p class="muted">Admin view for reviewing and curating submissions.</p>

    <section class="login-panel">
      <div class="btns">
        <button id="loginBtn">Login with Google</button>
        <button id="logoutBtn">Logout</button>
        <button id="checkBtn">Check admin claim</button>
        <button id="loadBtn">Load submissions</button>
      </div>

      <div id="authStatus" class="status">Not signed in.</div>
    </section>

    <section class="filters">
      <div class="row-3">
        <div>
          <label for="filterStatus">Filter</label>
          <select id="filterStatus">
            <option value="all">All</option>
            <option value="uncurated">Uncurated only</option>
            <option value="curated">Curated only</option>
            <option value="published">Published only</option>
            <option value="archived">Archived only</option>
          </select>
        </div>

        <div>
          <label for="searchText">Search</label>
          <input id="searchText" type="text" placeholder="Name, title, sentence, slug…" />
        </div>

        <div>
          <label for="sortMode">Sort</label>
          <select id="sortMode">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name</option>
          </select>
        </div>
      </div>

      <div class="btns">
        <button id="applyFiltersBtn">Apply filters</button>
        <button id="refreshBtn">Refresh data</button>
      </div>
    </section>

    <div id="listStatus" class="status"></div>
    <section id="cards" class="cards"></section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      doc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-FTHW5Mg8o7_JNXNalKIw_sdxtC-A-G0",
      authDomain: "photodiarygame.firebaseapp.com",
      projectId: "photodiarygame",
      storageBucket: "photodiarygame.firebasestorage.app",
      messagingSenderId: "745003978989",
      appId: "1:745003978989:web:727489ba72b34d77af3ce4",
      measurementId: "G-1T7CBFRP55"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const checkBtn = document.getElementById("checkBtn");
    const loadBtn = document.getElementById("loadBtn");
    const authStatusEl = document.getElementById("authStatus");
    const listStatusEl = document.getElementById("listStatus");
    const cardsEl = document.getElementById("cards");

    const filterStatusEl = document.getElementById("filterStatus");
    const searchTextEl = document.getElementById("searchText");
    const sortModeEl = document.getElementById("sortMode");
    const applyFiltersBtn = document.getElementById("applyFiltersBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let allSubmissions = [];
    let currentClaims = null;

    function setAuthStatus(msg, cls = "") {
      authStatusEl.className = `status ${cls}`.trim();
      authStatusEl.textContent = msg;
    }

    function setListStatus(msg, cls = "") {
      listStatusEl.className = `status ${cls}`.trim();
      listStatusEl.textContent = msg;
    }

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";
      try {
        if (typeof value.toDate === "function") return value.toDate().toLocaleString();
        return new Date(value).toLocaleString();
      } catch {
        return "—";
      }
    }

    async function refreshAdminClaims() {
      const user = auth.currentUser;
      if (!user) {
        currentClaims = null;
        return null;
      }
      const tokenResult = await user.getIdTokenResult(true);
      currentClaims = tokenResult.claims || {};
      return currentClaims;
    }

    async function requireAdmin() {
      const user = auth.currentUser;
      if (!user) throw new Error("No signed-in user.");

      const claims = await refreshAdminClaims();
      if (!claims || claims.admin !== true) {
        throw new Error("Signed in, but admin claim is missing.");
      }

      return user;
    }

    async function signIn() {
      try {
        setAuthStatus("Signing in with Google…");

        const cred = await signInWithPopup(auth, provider);
        const claims = await refreshAdminClaims();

        if (claims?.admin === true) {
          setAuthStatus(`Signed in as ${cred.user.email}. Admin claim OK.`, "ok");
        } else {
          setAuthStatus(`Signed in as ${cred.user.email}, but admin claim is missing.`, "warn");
        }
      } catch (err) {
        console.error(err);
        setAuthStatus(`Login error: ${err.message}`, "err");
      }
    }

    async function signOutNow() {
      try {
        await signOut(auth);
        currentClaims = null;
        setAuthStatus("Signed out.", "");
        cardsEl.innerHTML = "";
        setListStatus("");
      } catch (err) {
        console.error(err);
        setAuthStatus(`Sign-out error: ${err.message}`, "err");
      }
    }

    async function checkAdminClaim() {
      try {
        const user = auth.currentUser;
        if (!user) {
          setAuthStatus("No user signed in.", "warn");
          return;
        }

        const claims = await refreshAdminClaims();

        setAuthStatus(
          `Signed in as ${user.email}\nClaims: ${JSON.stringify(claims, null, 2)}`,
          claims?.admin === true ? "ok" : "warn"
        );
      } catch (err) {
        console.error(err);
        setAuthStatus(`Claim check error: ${err.message}`, "err");
      }
    }

    async function loadSubmissions() {
      try {
        await requireAdmin();

        setListStatus("Loading submissions…");

        const q = query(collection(db, "traces_submissions"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);

        allSubmissions = snap.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));

        setListStatus(`Loaded ${allSubmissions.length} submissions.`, "ok");
        renderList();
      } catch (err) {
        console.error(err);
        setListStatus(`Load error: ${err.message}`, "err");
      }
    }

    function filteredSubmissions() {
      const filter = filterStatusEl.value;
      const search = searchTextEl.value.trim().toLowerCase();
      const sort = sortModeEl.value;

      let items = [...allSubmissions];

      if (filter === "uncurated") items = items.filter(item => item.isCurated !== true);
      else if (filter === "curated") items = items.filter(item => item.isCurated === true);
      else if (filter === "published") items = items.filter(item => item.isPublished === true);
      else if (filter === "archived") items = items.filter(item => item.isArchived === true);

      if (search) {
        items = items.filter(item => {
          const blob = [
            item.participantName,
            item.imageTitle,
            item.sentence,
            item.slug,
            item.qrUrl
          ].join(" ").toLowerCase();

          return blob.includes(search);
        });
      }

      if (sort === "oldest") {
        items.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      } else if (sort === "name") {
        items.sort((a, b) => (a.participantName || "").localeCompare(b.participantName || ""));
      } else {
        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      }

      return items;
    }

    function renderList() {
      const items = filteredSubmissions();

      if (!items.length) {
        cardsEl.innerHTML = `<div class="empty">No submissions match the current filter.</div>`;
        return;
      }

      cardsEl.innerHTML = items.map(item => {
        const safeId = escapeHtml(item.id);
        const safeImageUrl = escapeHtml(item.imageUrl || "");
        const safeSentence = escapeHtml(item.sentence || "");
        const safeParticipantName = escapeHtml(item.participantName || "");
        const safeImageTitle = escapeHtml(item.imageTitle || "");
        const safeSlug = escapeHtml(item.slug || "");
        const safeQrUrl = escapeHtml(item.qrUrl || "");
        const safeCuratorNotes = escapeHtml(item.curatorNotes || "");

        return `
          <article class="card" data-id="${safeId}">
            <div class="card-inner">
              <div class="thumb">
                ${safeImageUrl
                  ? `<img src="${safeImageUrl}" alt="${safeImageTitle || "Trace image"}">`
                  : `<div class="small">No image</div>`}
              </div>

              <div class="editor">
                <div class="meta">
                  <span class="badge">${safeSlug || "no slug"}</span>
                  <span class="badge">Created: ${escapeHtml(formatDate(item.createdAt))}</span>
                  <span class="badge">Updated: ${escapeHtml(formatDate(item.updatedAt))}</span>
                  ${item.isCurated === true ? `<span class="badge">Curated</span>` : ``}
                  ${item.isPublished === true ? `<span class="badge">Published</span>` : ``}
                  ${item.isArchived === true ? `<span class="badge">Archived</span>` : ``}
                </div>

                <div class="row-3">
                  <div>
                    <label>Name or pseudonym</label>
                    <input type="text" class="field-participantName" value="${safeParticipantName}" maxlength="80" />
                  </div>
                  <div>
                    <label>Image title</label>
                    <input type="text" class="field-imageTitle" value="${safeImageTitle}" maxlength="120" />
                  </div>
                  <div>
                    <label>QR URL</label>
                    <input type="text" class="field-qrUrl" value="${safeQrUrl}" />
                  </div>
                </div>

                <div style="margin-top:0.9rem;">
                  <label>Sentence</label>
                  <textarea class="field-sentence" maxlength="120">${safeSentence}</textarea>
                </div>

                <div style="margin-top:0.9rem;">
                  <label>Curator notes</label>
                  <textarea class="field-curatorNotes">${safeCuratorNotes}</textarea>
                </div>

                <div class="checkrow">
                  <label><input type="checkbox" class="field-isCurated" ${item.isCurated === true ? "checked" : ""}> Curated</label>
                  <label><input type="checkbox" class="field-isPublished" ${item.isPublished === true ? "checked" : ""}> Published</label>
                  <label><input type="checkbox" class="field-isArchived" ${item.isArchived === true ? "checked" : ""}> Archived</label>
                </div>

                <div class="card-actions">
                  <button class="saveBtn">Save changes</button>
                  <a href="${safeQrUrl}" target="_blank" rel="noopener">Open personal trace</a>
                  <span class="small item-status"></span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      attachCardHandlers();
    }

    function attachCardHandlers() {
      cardsEl.querySelectorAll(".card").forEach(card => {
        const saveBtn = card.querySelector(".saveBtn");

        saveBtn.addEventListener("click", async () => {
          const id = card.dataset.id;
          const participantName = card.querySelector(".field-participantName").value.trim();
          const imageTitle = card.querySelector(".field-imageTitle").value.trim();
          const sentence = card.querySelector(".field-sentence").value.trim();
          const qrUrl = card.querySelector(".field-qrUrl").value.trim();
          const curatorNotes = card.querySelector(".field-curatorNotes").value.trim();
          const isCurated = card.querySelector(".field-isCurated").checked;
          const isPublished = card.querySelector(".field-isPublished").checked;
          const isArchived = card.querySelector(".field-isArchived").checked;
          const itemStatus = card.querySelector(".item-status");

          if (!participantName) {
            itemStatus.textContent = "Name is required.";
            itemStatus.className = "small item-status err";
            return;
          }

          if (!sentence) {
            itemStatus.textContent = "Sentence is required.";
            itemStatus.className = "small item-status err";
            return;
          }

          if (sentence.length > 120) {
            itemStatus.textContent = "Sentence must be max 120 characters.";
            itemStatus.className = "small item-status err";
            return;
          }

          try {
            await requireAdmin();
            itemStatus.textContent = "Saving…";
            itemStatus.className = "small item-status";

            const updateData = {
              participantName,
              imageTitle,
              sentence,
              qrUrl,
              isCurated,
              isPublished,
              isArchived,
              curatorEdited: true,
              curatorNotes,
              updatedAt: serverTimestamp(),
              curatedAt: isCurated ? serverTimestamp() : null,
              publishedAt: isPublished ? serverTimestamp() : null
            };

            await updateDoc(doc(db, "traces_submissions", id), updateData);

            const item = allSubmissions.find(x => x.id === id);
            if (item) Object.assign(item, updateData);

            itemStatus.textContent = "Saved.";
            itemStatus.className = "small item-status ok";
            renderList();
          } catch (err) {
            console.error(err);
            itemStatus.textContent = `Save error: ${err.message}`;
            itemStatus.className = "small item-status err";
          }
        });
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        setAuthStatus("Not signed in.");
        return;
      }

      try {
        const claims = await refreshAdminClaims();

        if (claims?.admin === true) {
          setAuthStatus(`Signed in as ${user.email}. Admin claim OK.`, "ok");
        } else {
          setAuthStatus(`Signed in as ${user.email}, but admin claim is missing.`, "warn");
        }
      } catch (err) {
        console.error(err);
        setAuthStatus(`Auth state error: ${err.message}`, "err");
      }
    });

    loginBtn.addEventListener("click", signIn);
    logoutBtn.addEventListener("click", signOutNow);
    checkBtn.addEventListener("click", checkAdminClaim);
    loadBtn.addEventListener("click", loadSubmissions);
    applyFiltersBtn.addEventListener("click", renderList);
    refreshBtn.addEventListener("click", loadSubmissions);
  </script>
</body>
</html>
