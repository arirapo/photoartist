<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traces Between — Video</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(92vw, 1400px);
      max-height: 92vh;
      aspect-ratio: 2 / 1;
      background: #000;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .title-label {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      color: rgba(255, 255, 255, 0.60);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .video-window {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(500px, 82vw);
      aspect-ratio: 2 / 1;
      background: #050505;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .video-window::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.01) 30%,
        rgba(0,0,0,0.08)
      );
      pointer-events: none;
      z-index: 2;
    }

    .video-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .bottom-link {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.48);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-link:hover,
    .bottom-link:focus-visible {
      color: rgba(255, 255, 255, 0.72);
      outline: none;
    }

    .audio-status {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 12;
      color: rgba(255, 255, 255, 0.26);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .audio-status.is-visible {
      opacity: 1;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.18), transparent 45%);
    }

    @media (max-width: 900px) {
      .scene {
        width: 100vw;
        height: 100vh;
        max-height: none;
        aspect-ratio: auto;
      }

      .title-label {
        top: 14px;
        font-size: 0.72rem;
      }

      .video-window {
        width: min(500px, 88vw);
      }

      .bottom-link {
        bottom: 18px;
        font-size: 0.72rem;
      }

      .audio-status {
        right: 14px;
        bottom: 14px;
        font-size: 0.64rem;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="title-label">Traces Between 2020–2026</div>

    <div class="video-window">
      <iframe
        class="video-frame"
        src="https://drive.google.com/file/d/13Y63iennm2v7qwU6zVS0j4LEfKBhj11m/preview"
        allow="autoplay"
        allowfullscreen
      ></iframe>
    </div>

    <a
      class="bottom-link"
      href="https://drive.google.com/file/d/1kx8hfqeIPQHrrW0C8vLhRItxdZNbSoW7/view?usp=drivesdk"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open original quality video"
    >
      Original Quality
    </a>

    <div class="audio-status" id="audio-status">Tap to enable sound</div>
    <div class="video-overlay"></div>
  </div>

  <audio
    id="bg-audio"
    preload="auto"
    loop
  >
    <source src="Icyharmony meditation carpet_01 2.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById("bg-audio");
    const audioStatus = document.getElementById("audio-status");

    let audioStarted = false;
    let autoplayBlocked = false;

    function showAudioNotice(text) {
      audioStatus.textContent = text;
      audioStatus.classList.add("is-visible");
    }

    function hideAudioNotice() {
      audioStatus.classList.remove("is-visible");
    }

    function tryStartAudio() {
      if (audioStarted) return;

      audio.play().then(() => {
        audioStarted = true;
        hideAudioNotice();
      }).catch(() => {
        autoplayBlocked = true;
        showAudioNotice("Tap to enable sound");
      });
    }

    audio.addEventListener("canplaythrough", () => {
      tryStartAudio();
    });

    function unlockAudioOnce() {
      if (audioStarted) return;
      tryStartAudio();

      if (autoplayBlocked) {
        setTimeout(() => {
          if (audioStarted) hideAudioNotice();
        }, 300);
      }
    }

    document.addEventListener("pointerdown", unlockAudioOnce, { passive: true });
    document.addEventListener("touchstart", unlockAudioOnce, { passive: true });
    document.addEventListener("click", unlockAudioOnce, { passive: true });

    window.addEventListener("load", () => {
      tryStartAudio();
    });
  </script>

</body>
</html>
