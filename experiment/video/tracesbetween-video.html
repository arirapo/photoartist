<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traces Between — Video</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(92vw, 1400px);
      max-height: 92vh;
      aspect-ratio: 2 / 1;
      background: #000;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .video-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .title-label {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      color: rgba(255, 255, 255, 0.60);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.16), transparent 45%);
    }

    .bottom-links {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .bottom-link {
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.48);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-link:hover,
    .bottom-link:focus-visible {
      color: rgba(255, 255, 255, 0.72);
      outline: none;
    }

    @media (max-width: 900px) {
      .scene {
        width: 100vw;
        height: 100vh;
        max-height: none;
        aspect-ratio: auto;
      }

      .title-label {
        top: 14px;
        font-size: 0.72rem;
      }

      .bottom-links {
        bottom: 18px;
        gap: 14px;
      }

      .bottom-link {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="title-label">Traces Between 2020–2026</div>

    <iframe
      class="video-frame"
      src="https://drive.google.com/file/d/13Y63iennm2v7qwU6zVS0j4LEfKBhj11m/preview"
      allow="autoplay"
      allowfullscreen
    ></iframe>

    <div class="video-overlay"></div>

    <div class="bottom-links">
      <a
        class="bottom-link"
        href="https://drive.google.com/file/d/13Y63iennm2v7qwU6zVS0j4LEfKBhj11m/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Video
      </a>

      <a
        class="bottom-link"
        href="https://drive.google.com/file/d/1kx8hfqeIPQHrrW0C8vLhRItxdZNbSoW7/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
      >
        Original Quality
      </a>
    </div>
  </div>

</body>
</html>
