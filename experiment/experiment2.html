<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photodiary Experiment 2</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(92vw, 1200px);
      max-height: 92vh;
      aspect-ratio: 16 / 10;
      background: #000;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.8s ease, transform 1s ease;
    }

    .scene.active img {
      filter: brightness(0.72) blur(2px);
      transform: scale(1.012);
    }

    .hotspot {
      position: absolute;
      width: 50mm;
      height: 50mm;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.22);
      border: 2px solid rgba(255, 0, 0, 0.6);
      transform: translate(-50%, -50%);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.12);
    }

    .hotspot.is-holding {
      transform: translate(-50%, -50%) scale(1.04);
      background: rgba(255, 0, 0, 0.28);
    }

    .status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.8rem;
      white-space: pre-line;
    }

    .poem-layer {
      position: absolute;
      inset: 0;
      display: grid;
      align-items: end;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.35), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .scene.active .poem-layer {
      opacity: 1;
    }

    .poem-box {
      padding: 30px;
    }

    .poem {
      color: white;
      font-size: 1.2rem;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.2s linear;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<div class="scene" id="scene">
  <div class="status" id="status">Loading...</div>

  <img src="../gallery/images/R0010140.jpeg" />

  <div class="hotspot" id="hotspot" style="top:55%; left:60%;"></div>

  <div class="poem-layer">
    <div class="poem-box">
      <p class="poem" id="poem"></p>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyD-FTHW5Mg8o7_JNXNalKIw_sdxtC-A-G0",
  authDomain: "photodiarygame.firebaseapp.com",
  projectId: "photodiarygame",
  storageBucket: "photodiarygame.firebasestorage.app",
  messagingSenderId: "745003978989",
  appId: "1:745003978989:web:727489ba72b34d77af3ce4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// ELEMENTIT
const scene = document.getElementById("scene");
const hotspot = document.getElementById("hotspot");
const poemEl = document.getElementById("poem");
const statusEl = document.getElementById("status");

// DATA
let poems = ["Fallback poem"];
let audio = null;
let assetsReady = false;

let progress = 0;
let holding = false;
let currentPoem = poems[0];

// 🔥 EI samaa runoa peräkkäin
let lastPoemIndex = -1;

function randomItem(arr) {
  if (!arr || arr.length === 0) return null;
  if (arr.length === 1) return arr[0];

  let index;
  do {
    index = Math.floor(Math.random() * arr.length);
  } while (index === lastPoemIndex);

  lastPoemIndex = index;
  return arr[index];
}

// 🔥 LATAUS
async function loadData() {
  try {
    const refDoc = doc(db, "experiments", "experiment2");
    const snap = await getDoc(refDoc);

    if (!snap.exists()) {
      statusEl.textContent = "Document not found";
      assetsReady = true;
      return;
    }

    const data = snap.data();

    if (Array.isArray(data.poems)) {
      poems = data.poems;
    }

    currentPoem = randomItem(poems);

    if (data.audioPath) {
      const url = await getDownloadURL(ref(storage, data.audioPath));
      audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0;
    }

    statusEl.textContent = `Poems loaded: ${poems.length}`;
    assetsReady = true;

  } catch (e) {
    statusEl.textContent = "Firebase error";
    assetsReady = true;
  }
}

// 🔥 ANIMAATIO
function update() {
  if (holding && assetsReady) {
    progress += 0.02;
  } else {
    progress -= 0.03;
  }

  progress = Math.max(0, Math.min(1, progress));

  scene.classList.toggle("active", progress > 0);
  hotspot.classList.toggle("is-holding", progress > 0);

  poemEl.style.opacity = progress;
  poemEl.textContent = currentPoem;

  if (audio) {
    audio.volume = progress * 0.5;
  }

  if (progress > 0 && audio && audio.paused) {
    audio.play().catch(()=>{});
  }

  if (progress === 0 && audio) {
    audio.pause();
    audio.currentTime = 0;
  }

  requestAnimationFrame(update);
}

// 🔥 HOLD
function beginHold(e) {
  e.preventDefault();
  if (!assetsReady) return;

  // 🔥 uusi runo joka kerta
  currentPoem = randomItem(poems);

  holding = true;
}

function endHold(e) {
  if (e) e.preventDefault();
  holding = false;
}

// EVENTS
hotspot.addEventListener("pointerdown", beginHold);
window.addEventListener("pointerup", endHold);

// INIT
loadData();
update();

</script>

</body>
</html>
