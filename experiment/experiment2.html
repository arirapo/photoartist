<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photodiary Experiment 2</title>

<style>
body {
  margin: 0;
  background: #111;
  display: grid;
  place-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.scene {
  position: relative;
  width: min(90vw, 1000px);
}

img {
  width: 100%;
  display: block;
  transition: filter 1s ease;
}

.scene.active img {
  filter: blur(3px) brightness(0.7);
}

.hotspot {
  position: absolute;
  width: 50mm;
  height: 50mm;
  border-radius: 50%;
  background: rgba(255,0,0,0.25);
  border: 2px solid rgba(255,0,0,0.6);
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.poem {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  color: white;
  font-size: 1.2rem;
  line-height: 1.5;
  opacity: 0;
  transition: opacity 1s linear;
}
</style>
</head>

<body>

<div class="scene" id="scene">
  <img src="../gallery/images/R0010140.jpeg">

  <div class="hotspot" id="hotspot" style="top: 55%; left: 60%;"></div>

  <div class="poem" id="poem"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

// 🔥 SINUN CONFIG (korjattu)
const firebaseConfig = {
  apiKey: "AIzaSyD-FTHW5Mg8o7_JNXNalKIw_sdxtC-A-G0",
  authDomain: "photodiarygame.firebaseapp.com",
  projectId: "photodiarygame",
  storageBucket: "photodiarygame.appspot.com",
  messagingSenderId: "745003978989",
  appId: "1:745003978989:web:727489ba72b34d77af3ce4",
  measurementId: "G-1T7CBFRP55"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

console.log("Firebase initialized");

// 🔥 ELEMENTIT
const scene = document.getElementById("scene");
const hotspot = document.getElementById("hotspot");
const poemEl = document.getElementById("poem");

let audio;
let poemText = "";

// 🔥 LADATAAN DATA FIREBASESTA
async function loadData() {
  try {
    const refDoc = doc(db, "experiments", "experiment2");
    const snap = await getDoc(refDoc);

    if (!snap.exists()) {
      console.error("Document not found");
      poemEl.textContent = "No data found.";
      return;
    }

    const data = snap.data();
    console.log("Firestore OK:", data);

    poemText = data.poemText || "";

    // 🔊 AUDIO
    if (data.audioPath) {
      const url = await getDownloadURL(ref(storage, data.audioPath));
      audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0;
    }

  } catch (e) {
    console.error("Firebase load failed:", e);
    poemEl.textContent = "Firebase load failed.";
  }
}

loadData();

// 🔥 HOLD LOGIIKKA
let progress = 0;
let holding = false;
let raf;

function update() {
  if (holding) {
    progress += 0.02;
  } else {
    progress -= 0.03;
  }

  progress = Math.max(0, Math.min(1, progress));

  scene.classList.toggle("active", progress > 0);

  poemEl.style.opacity = progress;
  poemEl.textContent = poemText;

  if (audio) {
    audio.volume = progress * 0.5;
  }

  if (progress > 0 && audio && audio.paused) {
    audio.play().catch(()=>{});
  }

  if (progress === 0 && audio) {
    audio.pause();
    audio.currentTime = 0;
  }

  raf = requestAnimationFrame(update);
}

update();

// 🖱️ + 📱 EVENTIT
hotspot.addEventListener("pointerdown", () => {
  holding = true;
});

window.addEventListener("pointerup", () => {
  holding = false;
});

</script>

</body>
</html>
