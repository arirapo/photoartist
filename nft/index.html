<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #field {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
    }

    #entry {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0,0,0,0.22);
      text-decoration: none;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: opacity 0.4s ease, color 0.4s ease;
      user-select: none;
    }

    #entry:hover {
      color: rgba(0,0,0,0.38);
    }

    #entry::after {
      content: ".";
    }

    #trace {
      position: absolute;
      left: 18%;
      top: 28%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          rgba(255,170,180,0.9) 0%,
          rgba(240,120,140,0.65) 45%,
          rgba(180,70,90,0.22) 75%,
          rgba(255,255,255,0) 100%);
      opacity: 0.58;
      filter: blur(0.2px);
    }

    @media (max-width: 700px) {
      #entry {
        font-size: 0.95rem;
        letter-spacing: 0.14em;
      }

      #trace {
        width: 15px;
        height: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="field">
    <div id="trace" aria-hidden="true"></div>
    <a id="entry" href="./portal.html">trace</a>
  </div>
</body>
</html>
