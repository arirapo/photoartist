<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traces Between — Memory Chat</title>

<style>
  :root {
    --bg: #0f0f0d;
    --panel: #171713;
    --text: #e9e2d0;
    --muted: #9f9787;
    --line: rgba(233,226,208,0.15);
    --accent: #c9a85f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top, rgba(201,168,95,0.10), transparent 35%),
      var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    padding: 22px;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 0 24px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: normal;
    letter-spacing: 0.04em;
  }

  .subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  #chat {
    flex: 1;
    padding: 22px 0;
    overflow-y: auto;
  }

  .msg {
    max-width: 88%;
    margin: 0 0 18px;
    padding: 14px 16px;
    line-height: 1.55;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.025);
    border-radius: 18px;
    animation: fadeIn 0.5s ease;
  }

  .oracle {
    margin-right: auto;
    border-top-left-radius: 4px;
  }

  .user {
    margin-left: auto;
    font-family: system-ui, sans-serif;
    background: rgba(201,168,95,0.08);
    border-color: rgba(201,168,95,0.25);
    border-top-right-radius: 4px;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 0 4px;
    border-top: 1px solid var(--line);
  }

  input {
    flex: 1;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 14px 16px;
    font-size: 1rem;
    outline: none;
  }

  input:focus {
    border-color: rgba(201,168,95,0.55);
  }

  button {
    background: var(--accent);
    color: #18150f;
    border: none;
    border-radius: 999px;
    padding: 0 18px;
    font-size: 1rem;
    cursor: pointer;
  }

  .note {
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
    margin: 10px 0 4px;
    font-family: system-ui, sans-serif;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    main { padding: 16px; }
    .msg { max-width: 95%; }
    h1 { font-size: 1.15rem; }
  }
</style>
</head>

<body>
<main>
  <header>
    <h1>Traces Between — memory chat</h1>
    <div class="subtitle">
      Kirjoita sana, muisto, paikka, esine, tunne tai unohtunut asia.
      Tämä sivu ei tallenna mitään. Se vain kuuntelee hetken.
    </div>
  </header>

  <section id="chat"></section>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Kirjoita jälki..." />
    <button>Lähetä</button>
  </form>

  <div class="note">Nothing is stored. The trace disappears when you leave.</div>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

const openings = [
  "Sulje hetkeksi silmät. Anna kuvan tulla hitaasti.",
  "Tuo on jälki. Ei ehkä kokonainen muisto, mutta tarpeeksi.",
  "Muisti ei aina vastaa suoraan. Se kiertää esineiden, valon ja hajujen kautta.",
  "Älä pakota muistia. Katso, mitä sen ympärille alkaa ilmestyä.",
  "Jos tämä olisi valokuva, mikä olisi sen reuna-alueella?"
];

const prompts = [
  "Mikä yksityiskohta tässä muistossa tuntuu kaikkein kirkkaimmalta?",
  "Missä kohtaa kehoa tämä muisto tuntuu?",
  "Mitä tästä muistosta puuttuu?",
  "Kuka on kuvan ulkopuolella?",
  "Miltä ilma tuntui juuri silloin?",
  "Mikä ääni kuuluisi taustalla?",
  "Mitä et enää muista, vaikka haluaisit?",
  "Mitä tämä muisto yrittää suojella?",
  "Jos tämä olisi ovi, mihin se avautuisi?",
  "Minkä pienen esineen ottaisit tästä muistosta mukaasi?"
];

const keywordResponses = [
  {
    keys: ["lapsi", "lapsuus", "koulu", "äiti", "isä", "mummo", "vaari"],
    lines: [
      "Lapsuuden muistot eivät aina ole tarinoita. Joskus ne ovat lattian väri, oven ääni tai aikuisen hahmo valossa.",
      "Palaa aivan pieneen yksityiskohtaan. Älä koko lapsuuteen. Vain yhteen huoneeseen."
    ]
  },
  {
    keys: ["unohtu", "unohdin", "en muista", "kadonnut"],
    lines: [
      "Unohtaminen ei ole tyhjyys. Se on paikka, jossa muisto on vaihtanut muotoa.",
      "Mitä tapahtuu, jos et yritäkään muistaa? Mikä jää silti jäljelle?"
    ]
  },
  {
    keys: ["kuva", "valokuva", "kamera", "valo"],
    lines: [
      "Valokuva ei todista kaikkea. Se jättää jäljen siitä, että jokin oli katsottavissa.",
      "Katso tätä kuin kuvaa, joka on hieman epäterävä. Mitä epäterävyys paljastaa?"
    ]
  },
  {
    keys: ["sur", "kuole", "menetin", "ikävä"],
    lines: [
      "Jotkut muistot tulevat lähelle hyvin hiljaa. Niitä ei tarvitse avata kokonaan.",
      "Voit pysyä vain reunalla. Sekin on muistamista."
    ]
  },
  {
    keys: ["tänään", "eilen", "aamu", "ilta", "viime"],
    lines: [
      "Viimeaikainen muisto ei ole vielä asettunut. Se on yhä liikkeessä.",
      "Mikä tästä hetkestä muuttuu muistoksi vasta myöhemmin?"
    ]
  }
];

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function oracleReply(text) {
  const lower = text.toLowerCase();

  for (const group of keywordResponses) {
    if (group.keys.some(k => lower.includes(k))) {
      return pick(group.lines) + " " + pick(prompts);
    }
  }

  return pick(openings) + " " + pick(prompts);
}

addMessage(
  "Tervetuloa. Kirjoita jokin pieni jälki: sana, paikka, ihminen, haju, esine, kuva tai asia jonka olet melkein unohtanut.",
  "oracle"
);

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(oracleReply(text), "oracle");
  }, 600 + Math.random() * 700);
});
</script>
</body>
</html>
