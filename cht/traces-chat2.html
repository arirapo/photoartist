<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traces Between — Memory Oracle</title>

<style>
:root {
  --bg: #0e0e0c;
  --panel: #171713;
  --text: #e9e2d0;
  --muted: #9d9587;
  --line: rgba(233,226,208,0.16);
  --accent: #c9a85f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 0%, rgba(201,168,95,0.12), transparent 34%),
    linear-gradient(to bottom, #11110f, var(--bg));
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  display: flex;
  justify-content: center;
}

main {
  width: 100%;
  max-width: 760px;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px 0 24px;
  border-bottom: 1px solid var(--line);
}

h1 {
  margin: 0;
  font-size: 1.35rem;
  font-weight: normal;
  letter-spacing: 0.05em;
}

.subtitle {
  margin-top: 10px;
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.55;
}

#chat {
  flex: 1;
  padding: 24px 0;
  overflow-y: auto;
}

.msg {
  max-width: 88%;
  margin: 0 0 18px;
  padding: 14px 16px;
  line-height: 1.55;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.025);
  border-radius: 18px;
  animation: fadeIn 0.45s ease;
  white-space: pre-wrap;
}

.oracle {
  margin-right: auto;
  border-top-left-radius: 4px;
}

.user {
  margin-left: auto;
  font-family: system-ui, sans-serif;
  background: rgba(201,168,95,0.08);
  border-color: rgba(201,168,95,0.26);
  border-top-right-radius: 4px;
}

form {
  display: flex;
  gap: 10px;
  padding: 14px 0 4px;
  border-top: 1px solid var(--line);
}

input {
  flex: 1;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 14px 16px;
  font-size: 1rem;
  outline: none;
}

input:focus {
  border-color: rgba(201,168,95,0.55);
}

button {
  background: var(--accent);
  color: #18150f;
  border: none;
  border-radius: 999px;
  padding: 0 18px;
  font-size: 1rem;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

.note {
  color: var(--muted);
  font-size: 0.78rem;
  text-align: center;
  margin: 10px 0 4px;
  font-family: system-ui, sans-serif;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 520px) {
  main { padding: 16px; }
  .msg { max-width: 95%; }
  h1 { font-size: 1.12rem; }
  button { padding: 0 15px; }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>Traces Between — memory oracle</h1>
    <div class="subtitle">
      Kirjoita sana, muisto, paikka, esine, tunne tai unohtunut asia.
      Oraakkeli vastaa vain tämän hetken ajan.
    </div>
  </header>

  <section id="chat"></section>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Kirjoita jälki..." />
    <button id="sendButton">Lähetä</button>
  </form>

  <div class="note">Nothing is stored. The trace disappears when you leave.</div>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");

let memoryOracle = null;

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function findMatchingCategories(text) {
  const lower = text.toLowerCase();

  return memoryOracle.categories.filter(category =>
    category.triggers.some(trigger => lower.includes(trigger.toLowerCase()))
  );
}

function oracleReply(text) {
  const matches = findMatchingCategories(text);
  const category = matches.length ? pick(matches) : null;

  const opening = category
    ? pick(category.responses)
    : pick(memoryOracle.generalOpenings);

  const trace = pick(memoryOracle.traceWords);
  const prompt = pick(memoryOracle.prompts);
  const challenge = pick(memoryOracle.softChallenges);

  const patterns = [
    `${opening}\n\nEhkä tässä näkyy ${trace}. ${prompt}`,
    `${opening}\n\nPysy hetki tämän äärellä. ${prompt}`,
    `${opening}\n\nTraces Between tunnistaa tässä pienen kohdan: ${trace}. ${prompt}`,
    `${opening}\n\nÄlä ratkaise sitä vielä. ${challenge}`,
    `${opening}\n\nJos tämä on ${trace}, mitä se pyytää sinua muistamaan?`,
    `${opening}\n\n${prompt} ${challenge}`
  ];

  return pick(patterns);
}

async function loadOracle() {
  try {
    const response = await fetch("memory-oracle.json");

    if (!response.ok) {
      throw new Error("JSON file not found");
    }

    memoryOracle = await response.json();

    addMessage(
      "Tervetuloa. Kirjoita jokin pieni jälki: sana, paikka, ihminen, haju, esine, kuva tai asia jonka olet melkein unohtanut.",
      "oracle"
    );

  } catch (error) {
    addMessage(
      "Oraakkelin sanasto ei latautunut. Tarkista, että memory-oracle.json on samassa kansiossa ja että se on oikeaa JSON-muotoa.",
      "oracle"
    );

    input.disabled = true;
    sendButton.disabled = true;
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();

  if (!memoryOracle) return;

  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    addMessage(oracleReply(text), "oracle");
  }, 550 + Math.random() * 850);
});

loadOracle();
</script>
</body>
</html>
